# logrotate for the team broker's log (~/airraikordee-mqtt/mosquitto.log, user eiclite, no sudo).
# The gateway modules rotate their own logs (5 MB x 3 files, common/logging_setup.py); this covers Mosquitto.
# Install (as eiclite):
#   crontab -e  ->  15 3 * * * /usr/sbin/logrotate -s ~/airraikordee-mqtt/logrotate.state ~/airraikordee/gateway/logrotate/airraikordee-mqtt.conf
# Adjust the path below if the repo is cloned somewhere else.
/home/eiclite/airraikordee-mqtt/mosquitto.log {
    weekly
    maxsize 10M
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
