# AirRaiKorDee gateway settings (Jetson Nano).
# No secrets here: passwords, tokens and API keys live in /etc/airraikordee/.env (copy .env.example).

mqtt:
  host: 127.0.0.1
  port: 1884                        # the team's broker (user-level Mosquitto, ~/airraikordee-mqtt); MQTT_PORT in .env wins
  keepalive: 30

logging:
  level: INFO
  dir: /var/log/airraikordee        # falls back to gateway/logs/ when not writable (laptop)

data_dir: /var/lib/airraikordee     # SQLite + snapshots; falls back to gateway/data/

# --- Node 1 (ESP32-S3) over USB serial: bridge/uart_bridge.py ---
node1:
  device: /dev/airraikordee-node1   # udev symlink (udev/99-airraikordee.rules); use /dev/ttyACM0 without it
  baud: 115200
  ack_timeout_s: 0.3                # Node 1 must answer {"ack": seq} within this
  retries: 3                        # resends after the first try, then an alert
  heartbeat_s: 0.5                  # Node 1 stops the servos after 2 s without a command/heartbeat
  reconnect_s: 1.0

# --- Firebase store-and-forward: cloud/uploader.py ---
uploader:
  db_file: outbox.db                # inside data_dir
  batch_size: 200
  poll_s: 1.0
  backoff_min_s: 1
  backoff_max_s: 300
  max_rows: 500000                  # oldest rows are dropped past this so the SD card never fills up
  stats_every_s: 10
  timeout_s: 10
  # Firebase paths and fields: docs/protocol.md "Firebase Realtime Database" (Farn's data contract).
  # Everything goes under devices/<DEVICE_ID>/; the device account and password are in .env.
  rates_s:                          # "latest" paths are overwritten at most this often
    telemetry/node1/latest: 2
    telemetry/node2/latest: 2
    env/latest: 2
    state: 2
  health_every_s: 10                # health.py marks a node offline after 30 s; 10 keeps the dashboard within AIR-21
  node_offline_s: 30                # node*_online = false after this long without telemetry

# --- cloud/config_listener.py: dashboard settings (devices/<DEVICE_ID>/config) -> ab/gw/config ---
config_listener:
  poll_s: 5                         # AIR-97: every 5-10 s
  manual_resend_s: 60               # repeat the manual fan command (Node 1 forgets it after a reset)
  backoff_max_s: 60                 # slower polls while Firebase is unreachable
  timeout_s: 10
  cache_file: config_cache.json     # inside data_dir; last good settings for a boot without internet

# --- health/health.py: node timeouts, Jetson load, filter hours -> ab/gw/health ---
health:
  node_offline_s: 30                # a node is offline after this long without a message (AIR-21)
  publish_every_s: 10               # heartbeat; also sent at once when a node goes on/offline
  disk_warn_pct: 85
  baseline_hours: 1.0               # learn fan RPM per fan % during the first hour of a new filter
  save_every_s: 60
  state_file: health_state.json     # inside data_dir: filter/PMS hours and the RPM baseline

# --- brain/decision.py (spec section 4) ---
decision:
  pm_alert: 35                      # µg/m³; default until the dashboard sets config.pm_alert
  humidity_k: 0.5                   # pm25_corrected = pm25 / (1 + k * max(0, rh - 60) / 40); calibrate later
  fan_table:                        # [pm25_corrected upper bound, fan %]
    - [15, 25]
    - [35, 45]
    - [55, 70]
    - [100000, 100]
  night_start: "22:00"
  night_end: "06:00"
  night_fan_max: 35
  idle_after_s: 600
  aim_deadband_deg: 3
  aim_max_step_deg: 10
  charge_person_window_s: 900
  charge_max_temp_c: 45
  charge_refresh_s: 30              # Node 2 stops by itself 60 s after the last charge_allowed
  pm_alert_min: 10                  # pm_high after this many minutes above pm_alert
  fan_resend_s: 60                  # repeat the fan command (Node 1 forgets it after a reset)
  aim_gain: 0.8                     # P-controller gain on the person's pan/tilt error
  clogged_ratio: 0.7                # filter_clogged when health's fan_rpm_ratio stays below this
  clogged_for_s: 600
  battery_low_pct: 25

# --- vision/vision.py ---
vision:
  device: /dev/video0
  width: 640
  height: 480
  fps: 10
  hfov_deg: 60                      # MEASURE the real webcam
  vfov_deg: 45
  publish_hz: 5
  model: ssd-mobilenet-v2
  threshold: 0.5
  person_height_m: 1.7              # for the distance estimate
  snapshot_keep: 200
  survey_every_s: 1800              # also on a dust spike and on {"cmd":"survey"}
  survey_step_timeout_s: 20         # 180° takes ~15 s
  survey_settle_s: 1.0

# --- ai/cause_rules.py, ai/cause_cloud.py ---
cause:
  spike_ugm3: 15
  spike_window_s: 300
  humidity_rise_pct: 5
  slow_rise_ugm3: 10
  slow_window_s: 1800
  outdoor_ratio: 0.8
  min_pm: 25                        # re-check every check_every_s while PM is at least this
  check_every_s: 300
  outdoor_pm_url: ""                # JSON API for outdoor PM2.5 (empty = not used)
  outdoor_pm_key: pm25              # dotted path to the number in that JSON, e.g. data.iaqi.pm25.v
  cloud_min_confidence: 0.8
  cloud_min_interval_s: 600
  cloud_timeout_s: 30               # the model thinks before answering; 10 s was too short
  snapshot_max_age_s: 900
  max_images: 8
  image_max_width: 640

# --- voice/voice.py: wake word -> INMP441 clip from Node 1 -> Google STT -> command -> Google TTS (AIR-20) ---
voice:
  player: aplay -q                  # USB speaker: add -D plughw:<card>,0 (card number from `aplay -l`)
  volume: 1.0                       # 0-1, scales the WAV before playing
  language: th-TH
  tts_voice: th-TH-Standard-A       # th-TH-Neural2-C sounds better, smaller free quota
  fan_step_pct: 25                  # "ฟอกแรงขึ้น / เบาลง"
  audio_timeout_s: 8                # wake -> end of clip; Node 1 stops recording at 5 s
  audio_retries: 3                  # rounds of asking Node 1 for missing frames
  cause_wait_s: 20                  # "ทำไมฝุ่นเยอะ": wait this long for cause_rules
  llm_timeout_s: 15

# --- notify/discord.py: alerts -> Discord webhook (AIR-52); the URL is DISCORD_WEBHOOK_URL in .env ---
notify:
  discord:
    cooldown_min: 15                # one message per alert type in this window
    photo_for: [pm_high]            # alert types that get the newest survey photo (faces blurred first)
    photo_max_age_s: 900
    max_attempts: 5
    unit_name: AirRaiKorDee

# --- sensors/bme280_reader.py: BME280 on the Jetson I2C bus -> ab/gw/env (AIR-12) ---
bme280:
  bus: 1                            # header pins 3 (SDA) / 5 (SCL)
  address: 0x76                     # 0x77 if SDO is tied high; check with `sudo i2cdetect -y -r 1`
  period_s: 2
  retry_s: 10                       # reopen the bus after this long of I2C errors
  temp_offset_c: 0.0                # MEASURE: the base gets warm from the Jetson; compare with a thermometer
